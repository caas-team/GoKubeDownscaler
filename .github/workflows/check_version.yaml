name: Check for new version

on:
  push:
    branches:
      - main
      - "release/[0-9]*.[0-9]*"
    paths:
      - deployments/chart/Chart.yaml

jobs:
  check_versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_change: ${{ steps.check_for_version_change.outputs.version_change }}
      app_version_change: ${{ steps.check_for_appVersion_change.outputs.app_version_change }}
      version: ${{ steps.chart_version.outputs.version }}
      app_version: ${{ steps.app_version.outputs.app_version }}
      set_latest: ${{ steps.determine_latest.outputs.set_latest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for appVersion change
        id: check_for_appVersion_change
        run: |
          app_version_change=$(git diff HEAD~1 HEAD -- deployments/chart/Chart.yaml | grep -qe "^[+-]appVersion: " && echo "appVersion changed" || echo "appVersion didn't change")
          echo "app_version_change=$app_version_change" >> $GITHUB_OUTPUT

      - name: Check for version change
        id: check_for_version_change
        run: |
          version_change=$(git diff HEAD~1 HEAD -- deployments/chart/Chart.yaml | grep -qe "^[+-]version: " && echo "version changed" || echo "version didn't change")
          echo "version_change=$version_change" >> $GITHUB_OUTPUT

      - name: Extract Chart Version
        id: chart_version
        run: |
          version=$(yq e '.version' ./deployments/chart/Chart.yaml)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Extract App Version
        id: app_version
        run: |
          app_version=$(yq e '.appVersion' ./deployments/chart/Chart.yaml)
          echo "app_version=$app_version" >> $GITHUB_OUTPUT

      - name: Determine if this is the latest release line
        id: determine_latest
        env:
          APP_VERSION: ${{ steps.app_version.outputs.app_version }}
        run: |
          current_major_minor=$(echo "$APP_VERSION" | cut -d. -f1,2)

          # gather major.minor of every existing release/* branch, plus the version being built,
          # so the very first release of a line is included in the comparison
          versions=$(
            {
              git ls-remote --heads origin 'release/*' | sed -E 's#.*refs/heads/release/##'
              echo "$current_major_minor"
            } | sort -u
          )

          highest=$(printf '%s\n' "$versions" | sort -V | tail -1)

          if [ "$current_major_minor" = "$highest" ]; then
            echo "set_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "set_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build_new_chart:
    needs: check_versions
    if: ${{ needs.check_versions.outputs.version_change == 'version changed' }}
    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/helm_build.yaml
    with:
      version: ${{ needs.check_versions.outputs.version }}
      appVersion: ${{ needs.check_versions.outputs.app_version }}
    secrets: inherit

  build_new_image:
    needs: check_versions
    if: ${{ needs.check_versions.outputs.app_version_change == 'appVersion changed' }}
    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/docker_build.yaml
    with:
      appVersion: ${{ needs.check_versions.outputs.app_version }}
      setLatest: ${{ needs.check_versions.outputs.set_latest == 'true' }}
    secrets: inherit

  release_new_version:
    needs: check_versions
    if: ${{ needs.check_versions.outputs.app_version_change == 'appVersion changed' }}
    permissions:
      contents: write

    uses: ./.github/workflows/create_release.yaml
    with:
      appVersion: ${{ needs.check_versions.outputs.app_version }}
    secrets: inherit
