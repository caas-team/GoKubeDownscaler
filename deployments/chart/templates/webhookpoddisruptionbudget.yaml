{{- if or .Values.webhookController.podDisruptionBudget.minAvailable .Values.webhookController.podDisruptionBudget.maxUnavailable }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "go-kube-downscaler.webhookController.fullname" . }}
  labels:
    {{- include "go-kube-downscaler.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "go-kube-downscaler.webhookController.selectorLabels" . | nindent 6 }}
  {{- if .Values.webhookController.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.webhookController.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{-  if .Values.webhookController.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.webhookController.podDisruptionBudget.maxUnavailable }}
  {{- end }}
{{- end }}
