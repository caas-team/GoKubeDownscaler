{{- if and .Values.webhookController.enabled .Values.webhookController.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "go-kube-downscaler.webhookController.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.webhookController.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
