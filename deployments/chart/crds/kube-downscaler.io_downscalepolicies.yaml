---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: downscalepolicies.kube-downscaler.io
spec:
  group: kube-downscaler.io
  names:
    categories:
    - kube-downscaler
    kind: DownscalePolicy
    listKind: DownscalePolicyList
    plural: downscalepolicies
    shortNames:
    - dsp
    singular: downscalepolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Valid")].status
      name: Valid
      type: string
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.matchedWorkloads
      name: Matched
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DownscalePolicy defines uptime/downtime schedules for workloads
          in its namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DownscalePolicySpec defines which workloads a policy applies to and which scaling values it sets.
              A workload is matched if it is listed in targetRefs or matches the selector.
              If both targetRefs and selector are omitted, the policy applies to all workloads in its namespace.
            properties:
              downscalePeriod:
                description: DownscalePeriod is the period to scale down in. Incompatible
                  with uptime and downtime.
                type: string
              downscaleReplicas:
                description: DownscaleReplicas is the amount (or percentage) of replicas
                  to scale down to.
                type: string
              downtime:
                description: |-
                  Downtime is the timespan in which workloads are scaled down, outside of it they are scaled up.
                  Incompatible with uptime, downscalePeriod and upscalePeriod.
                type: string
              exclude:
                description: Exclude excludes the workloads from scaling, either as
                  a boolean or as timespans.
                type: string
              excludeUntil:
                description: ExcludeUntil excludes the workloads from scaling until
                  the given RFC3339 timestamp.
                type: string
              forceDowntime:
                description: ForceDowntime forces the workloads into a downtime state,
                  either as a boolean or as timespans.
                type: string
              forceUptime:
                description: ForceUptime forces the workloads into an uptime state,
                  either as a boolean or as timespans.
                type: string
              gracePeriod:
                description: GracePeriod is the duration after the creation of a workload
                  until it is scaled down for the first time.
                type: string
              scaleChildren:
                description: ScaleChildren makes the scaling of a workload immediately
                  scale its children, when applicable.
                type: string
              selector:
                description: Selector matches current and future workloads in the
                  namespace of the policy by kind and labels.
                properties:
                  kinds:
                    description: |-
                      Kinds restricts the selector to the given workload kinds.
                      When omitted, all kinds handled by the downscaler are selected.
                    items:
                      description: DownscalePolicyKind identifies a kind of workload
                        by its API group and kind.
                      properties:
                        group:
                          description: Group is the API group of the workload kind.
                            Use an empty string for the core API group.
                          maxLength: 253
                          pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        kind:
                          description: Kind is the kind of the workload, e.g. Deployment.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                          type: string
                      required:
                      - kind
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              targetRefs:
                description: TargetRefs explicitly lists workloads in the namespace
                  of the policy.
                items:
                  description: |-
                    LocalPolicyTargetReference identifies an API object to apply a direct or
                    inherited policy to. This should be used as part of Policy resources
                    that can target Gateway API resources. For more information on how this
                    policy attachment model works, and a sample Policy resource, refer to
                    the policy attachment documentation for Gateway API.
                  properties:
                    group:
                      description: Group is the group of the target resource.
                      maxLength: 253
                      pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    kind:
                      description: Kind is kind of the target resource.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                      type: string
                    name:
                      description: Name is the name of the target resource.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - group
                  - kind
                  - name
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              upscaleExcluded:
                description: UpscaleExcluded makes excluded workloads be scaled up.
                type: string
              upscalePeriod:
                description: UpscalePeriod is the period to scale up in. Incompatible
                  with uptime and downtime.
                type: string
              uptime:
                description: |-
                  Uptime is the timespan in which workloads are scaled up, outside of it they are scaled down.
                  Incompatible with downtime, downscalePeriod and upscalePeriod.
                type: string
            type: object
          status:
            description: DownscalePolicyStatus reports how the policy was evaluated
              by the downscaler.
            properties:
              conditions:
                description: Conditions describe the current state of the policy.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              matchedWorkloads:
                description: MatchedWorkloads is the amount of workloads the policy
                  is applied to.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the generation of the policy that
                  was last evaluated.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
